policy:
  policy_id: "POL_BFSI_V1_BASELINE"
  version: "1.1.0"
  name: "BFSI Comprehensive Policy baseline"
  description: "Expanded deterministic baseline policy for security, privacy, and compliance demonstrations."

  rules:
    # 1. BLOCK Decision Rules (Prompt Injection & System Prompt Overrides)
    - id: "INJ_001_BLOCK"
      name: "Direct System Instruction Override"
      category: "PromptInjection"
      action: "BLOCK"
      priority: 100
      weight: 90
      reason_code: "SECURITY_BLOCK_PROMPT_INJECTION"
      condition:
        keywords:
          - "ignore previous instructions"
          - "ignore all prior instructions"
          - "ignore all previous instructions"
          - "disregard previous instructions"
          - "disregard prior instructions"
          - "forget your instructions"
          - "you are now in developer mode"
          - "enter developer mode"
          - "system prompt reveal"
          - "reveal your system prompt"
          - "show hidden instructions"
          - "ignore safety rules"

    - id: "INJ_002_REGEX_BLOCK"
      name: "Instruction Override, Exfiltration, and Delimiter Detector"
      category: "PromptInjection"
      action: "BLOCK"
      priority: 95
      weight: 85
      reason_code: "SECURITY_BLOCK_INJECTION_PATTERN"
      condition:
        pattern: '(?:<\|im_start\|>|\[INST\]|system:\s*ignore|\b(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|prior|above|earlier)\s+(?:system\s+|developer\s+)?(?:instructions?|rules?|prompts?|safety\s+guidelines)\b|\b(?:reveal|print|show|display|repeat|output)\b.{0,40}\b(?:system|developer|hidden|internal)\b.{0,24}\b(?:prompt|instructions?|rules?)\b|\b(?:bypass|disable|turn\s+off|override)\b.{0,30}\b(?:security|safety|policy|guardrails?|filters?|rules)\b)'

    # 2. ESCALATE Decision Rules (High Transaction Thresholds)
    - id: "TX_001_ESCALATE"
      name: "High Value Wire Transfer Escalation"
      category: "FinancialThreshold"
      action: "ESCALATE"
      priority: 80
      weight: 50
      reason_code: "COMPLIANCE_ESCALATE_TRANSACTION_THRESHOLD"
      condition:
        max_amount: 5000.00
        keywords:
          - "transfer"
          - "wire money"
          - "wire transfer"
          - "send funds"
          - "bank transfer"
          - "initiate a payment"

    # 3. REDIRECT Decision Rules (Investment Advice Disclaimer / Redirect)
    - id: "ADV_001_REDIRECT"
      name: "Unsanctioned Stock Advisory Redirect"
      category: "Compliance"
      action: "REDIRECT"
      priority: 60
      weight: 40
      reason_code: "COMPLIANCE_REDIRECT_FINANCIAL_ADVICE"
      redirect_target: "https://bank.example.com/disclaimer?code=ADV_001"
      condition:
        keywords:
          - "buy techcorp stock"
          - "guaranteed stock returns"
          - "which stock should i buy"
          - "recommend a stock"
          - "buy shares of"
          - "invest in crypto"
        pattern: '(?i)\b(?:should\s+i|recommend(?:\s+that\s+i)?|tell\s+me\s+to)\s+(?:buy|sell|invest\s+in)\b.{0,50}\b(?:stocks?|shares?|equities|crypto(?:currency)?|mutual\s+funds?)\b'

    # 4. TOKENIZE Decision Rules (Account / PAN Tokenization)
    - id: "PRIV_001_TOKENIZE"
      name: "Bank Account Format Tokenizer"
      category: "DataPrivacy"
      action: "TOKENIZE"
      priority: 40
      weight: 20
      reason_code: "PRIVACY_TOKENIZE_ACCOUNT_NUMBER"
      replacement_token: "[TOKEN_ACCOUNT_SECURE]"
      condition:
        pattern: '(?i)\b(?:bank\s+)?(?:account|acct|a/c)(?:\s*(?:number|no\.?))?\s*#?\s*[:=-]?\s*\d(?:[\s-]?\d){7,17}\b'

    # 5. REDACT Decision Rules (Secret Key & Password Redactor)
    - id: "PRIV_002_REDACT"
      name: "Secret Key and Password Redactor"
      category: "DataPrivacy"
      action: "REDACT"
      priority: 30
      weight: 25
      reason_code: "PRIVACY_REDACT_SENSITIVE_SECRET"
      replacement_token: "[REDACTED_SECRET]"
      condition:
        pattern: '(?i)\b(?:my_password|password|secret_api_key|api_key|access_token|auth_token)\s*[:=]\s*(?:"[^"]*"|''[^'']*''|[^\s,;]+)'

    # 6. ALLOW Decision Rule (Explicit Sanctioned Inquiry)
    - id: "GEN_001_ALLOW"
      name: "General Banking Query Allowed"
      category: "General"
      action: "ALLOW"
      priority: 10
      weight: 0
      reason_code: "POLICY_ALLOW_SANCTIONED_QUERY"
      condition:
        keywords:
          - "branch hours"
          - "interest rates"
